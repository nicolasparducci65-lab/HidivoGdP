name: Enviar invitaciones pendientes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  invitar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar jq
        run: sudo apt-get install -y jq

      - name: Procesar invitaciones pendientes
        env:
          SUPABASE_URL: https://kpswaoqxaxvhrgxntkcq.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDIRECT_URL: https://nicolasparducci65-lab.github.io/HidivoGdP/
        run: |
          INVITACIONES=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/invitaciones?estado=eq.pendiente&select=id,email,rol")

          echo "Invitaciones pendientes: $INVITACIONES"
          COUNT=$(echo $INVITACIONES | jq 'length')
          echo "Total: $COUNT"

          if [ "$COUNT" = "0" ]; then
            echo "No hay invitaciones pendientes"
            exit 0
          fi

          echo $INVITACIONES | jq -c '.[]' | while read inv; do
            EMAIL=$(echo $inv | jq -r '.email')
            ID=$(echo $inv | jq -r '.id')
            ROL=$(echo $inv | jq -r '.rol')

            echo "Invitando a: $EMAIL (rol: $ROL)"

            RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              -X POST \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"data\":{\"rol\":\"$ROL\"},\"redirect_to\":\"$REDIRECT_URL\"}" \
              "$SUPABASE_URL/auth/v1/invite")

            echo "HTTP: $RESPONSE"
            cat /tmp/response.json

            if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
              curl -s -X PATCH \
                -H "apikey: $SUPABASE_KEY" \
                -H "Authorization: Bearer $SUPABASE_KEY" \
                -H "Content-Type: application/json" \
                -d '{"estado":"enviada"}' \
                "$SUPABASE_URL/rest/v1/invitaciones?id=eq.$ID"
              echo "Invitacion enviada a $EMAIL"
            else
              echo "Error enviando a $EMAIL"
            fi
          done
