name: Email Diario Registro Obra

on:
  schedule:
    - cron: '15 21 * * *'  # 21:15 UTC = 16:15 ECT (UTC-5)
    - cron: '*/5 * * * *'  # Cada 5 minutos para invitaciones
  workflow_dispatch:

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar recordatorio diario
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_KEY;
          const RESEND_KEY = process.env.RESEND_API_KEY;
          const BASE_URL = 'https://nicolasparducci65-lab.github.io/HidivoGdP';

          async function fetch(url, options) {
            return new Promise((resolve, reject) => {
              const urlObj = new URL(url);
              const req = https.request({
                hostname: urlObj.hostname,
                path: urlObj.pathname + urlObj.search,
                method: options.method || 'GET',
                headers: options.headers || {}
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve({ ok: res.statusCode < 300, json: () => JSON.parse(data), status: res.statusCode }));
              });
              req.on('error', reject);
              if(options.body) req.write(options.body);
              req.end();
            });
          }

          async function main() {
            const now = new Date();
            const hour = now.getUTCHours();
            const minute = now.getUTCMinutes();

            // Solo enviar recordatorio a las 21:15 UTC
            if(hour === 21 && minute >= 15 && minute < 20) {
              const proyRes = await fetch(`${SUPABASE_URL}/rest/v1/proyectos?estado=eq.ejecucion&select=id,nombre,contratista,ubicacion`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
              });
              const proyectos = await proyRes.json();
              console.log(`Proyectos en ejecucion: ${proyectos.length}`);

              const hoy = new Date().toISOString().split('T')[0];
              const fechaTexto = new Date().toLocaleDateString('es-EC', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

              for (const proyecto of proyectos) {
                const emailsRes = await fetch(`${SUPABASE_URL}/rest/v1/libro_obra?proyecto_id=eq.${proyecto.id}&residente_email=not.is.null&select=residente_email,residente_nombre&order=created_at.desc&limit=1`, {
                  headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const ultimoRegistro = await emailsRes.json();

                const hoyRes = await fetch(`${SUPABASE_URL}/rest/v1/libro_obra?proyecto_id=eq.${proyecto.id}&fecha=eq.${hoy}&select=id`, {
                  headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const registrosHoy = await hoyRes.json();
                const yaRegistro = registrosHoy.length > 0;
                const formUrl = `${BASE_URL}/registro-obra.html?proyecto=${proyecto.id}`;

                if (ultimoRegistro.length > 0 && ultimoRegistro[0].residente_email) {
                  const email = ultimoRegistro[0].residente_email;
                  const nombre = ultimoRegistro[0].residente_nombre || 'Residente';
                  const subject = yaRegistro ? `Registro completado - ${proyecto.nombre}` : `Recordatorio: Registro diario - ${proyecto.nombre}`;
                  const html = `<p>Hola ${nombre}, ${yaRegistro ? 'el registro de hoy ya fue completado.' : 'recuerda completar el registro de hoy.'}</p><a href="${formUrl}">Llenar registro</a>`;
                  await fetch('https://api.resend.com/emails', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${RESEND_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from: 'HIDIVO <onboarding@resend.dev>', to: [email], subject, html })
                  });
                  console.log(`Email enviado a ${email}`);
                }
              }
            }

            // Procesar invitaciones pendientes (corre cada 5 minutos)
            console.log('Verificando invitaciones pendientes...');
            const invRes = await fetch(`${SUPABASE_URL}/rest/v1/invitaciones?estado=eq.pendiente&select=id,email,rol`, {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const invitaciones = await invRes.json();
            console.log(`Invitaciones pendientes: ${invitaciones.length}`);

            for(const inv of invitaciones) {
              console.log(`Invitando: ${inv.email}`);
              const res = await fetch(`${SUPABASE_URL}/auth/v1/invite`, {
                method: 'POST',
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  email: inv.email,
                  data: { rol: inv.rol },
                  redirect_to: `${BASE_URL}/`
                })
              });
              console.log(`HTTP ${res.status} para ${inv.email}`);
              if(res.status === 200 || res.status === 201) {
                await fetch(`${SUPABASE_URL}/rest/v1/invitaciones?id=eq.${inv.id}`, {
                  method: 'PATCH',
                  headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ estado: 'enviada' })
                });
                console.log(`OK: invitacion enviada a ${inv.email}`);
              }
            }
          }

          main().catch(console.error);
          SCRIPT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
